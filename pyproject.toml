[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rivyou-shopify-discovery"
version = "1.0.0"
description = "Pipeline to discover and verify 1,000+ Indian Shopify storefronts with rich contact and brand extraction"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Rivyou SDE Candidate"}
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "tldextract>=5.1.0",
    "dnspython>=2.6.0",
    "phonenumbers>=8.13.0",
    "pandas>=2.2.0",
    "regex>=2024.5.15",
    "tenacity>=8.3.0",
    "orjson>=3.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
